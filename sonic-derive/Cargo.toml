[package]
name = "sonic-derive"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "High-performance Serde-compatible derive for sonic-rs"
repository = "https://github.com/cloudwego/sonic-rs"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }
